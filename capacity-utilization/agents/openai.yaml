interface:
  display_name: capacity utilization
  short_description: Analyzes a company's capacity utilization against its own historical
    range, segment-matched peers, and the sector supply/demand balance, then assesses
    the pricing power and cycle signal it implies. Works both for companies that disclose
    a utilization rate and for those that do not (e.g., TSMC, Samsung, Intel), using
    clearly labeled derived loading ratios. Use when asked about capacity utilization,
    operating rates, fab loading, utilization cycles, supply/demand tightness, whether
    a company is near full capacity or has excess capacity, or what utilization implies
    for pricing and margins. Do NOT use for capex discipline and ROIIC (capex-cycle),
    where a company sits in its broader demand cycle (cycle-positioning), or cost
    structure (manufacturing-cost-structure).
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
