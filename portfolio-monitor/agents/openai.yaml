interface:
  display_name: portfolio monitor
  short_description: Continuous portfolio monitoring — daily overlay scanning, alert
    emission, and escalation state tracking. Reads current portfolio state + fresh
    market data, applies the Rule 7 risk overlays of `portfolio-construction-and-risk`
    (soft/hard stops, drawdown gates, squeeze detection, buy-in notices, drift triggers),
    tracks IC-revote windows for soft-stopped positions, and produces the alert list
    + recommended actions for HITL review. Trigger phrases — monitor portfolio, daily
    portfolio scan, check stops, check overlays, drawdown check, squeeze scan, portfolio
    health, escalation review. Do NOT use for portfolio construction (use `portfolio-construction-and-risk`),
    for IC-level buy/sell/short judgment (made by the user's investment committee
    outside this library), or for trade execution (handled outside this library).
    This Skill READS state and EMITS alerts + recommendations; it does not size positions
    or trigger trades directly.
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
