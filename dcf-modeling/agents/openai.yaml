interface:
  display_name: dcf modeling
  short_description: Build a full 3-statement financial model (income statement, balance
    sheet, cash flow) and a DCF valuation in Excel with live formulas, using Distilla
    MCP data (actuals, consensus estimates, prices) for US, Korean, Japanese, Chinese
    and Hong Kong listed companies. Use this skill whenever the user asks to value
    a company, build a DCF, do a discounted cash flow, build a 3-statement or three-statement
    model, estimate intrinsic or fair value, work out what a stock is worth, or asks
    for a financial model or valuation model of a listed company, even if they don't
    say "DCF" or "Distilla". Also use it for bull/bear/base scenario valuations, WACC-and-terminal-growth
    sensitivity tables, or updating a model built earlier with this skill.
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
