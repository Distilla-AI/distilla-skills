interface:
  display_name: dcf modeling
  short_description: Build a full 3-statement financial model (income statement, balance
    sheet, cash flow) and a DCF valuation in Excel with live formulas, using Distilla
    MCP data (actuals, consensus estimates, prices) for listed companies in Distilla's
    coverage. Use this skill whenever the user asks to value a company, build a DCF,
    do a discounted cash flow, build a 3-statement or three-statement model, estimate
    intrinsic or fair value, work out what a stock is worth, or asks for a financial
    model or valuation model of a listed company, even if they don't say "DCF" or
    "Distilla". Also use it for bull/bear/base scenario valuations, WACC-and-terminal-growth
    sensitivity tables, or updating a model built earlier with this skill. Do NOT
    use for a first-pass screen with a verdict (initial-screen), why a multiple re-rated
    (valuation-compression-recovery), a peer multiple comparison (peer-benchmarking),
    a long/short pitch with catalyst and R/R (long-short-ideas), or an investment
    committee review (fundamental-guru).
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
