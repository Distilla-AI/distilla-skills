interface:
  display_name: stock screener
  short_description: Cross-universe / multi-company screening — filters a declared
    universe down to a ranked, evidence-backed shortlist. Produces a universe declaration,
    count contract, ranked table with per-row evidence, and caveats block. Use when
    the user asks "Which companies …", "Screen for …", "Rank by …", "Top N …", "Companies
    with X …" — any cross-sectional filter or ranking question returning a *list*
    of issuers **without a directional trade thesis**, including which stocks were
    upgraded or downgraded (rating-event screens). Do NOT use for single-company analysis
    (`initial-screen`, `company-brief`), market-recap summaries (`daily-brief`), historical
    macro pattern questions about past market behavior ("which sectors historically
    outperformed after X"), or actionable long/short trade recommendations carrying
    thesis + catalyst + invalidation + R/R — use `long-short-ideas` for that last
    case.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
