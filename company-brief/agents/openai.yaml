interface:
  display_name: company brief
  short_description: Generates a ≤2-page investor briefing on one named company plus
    5–7 sharp questions for management — snapshot, key drivers, financial scorecard
    (annual, recent quarters, valuation vs. its own 3-year range), recent developments,
    bull/bear. Use when the user asks for a "2-pager", "company brief", "meeting prep",
    "briefing" or questions for a management meeting on a named company, including
    ADRs, dual listings and foreign filers; a "tear sheet" request goes here only
    when it is for a meeting or asks for management questions. Objective and factual
    — no buy/sell calls, ratings or price targets. Do NOT use for a first-pass screen
    with a verdict (initial-screen), a full financial-statement diagnosis (financial-statement-review),
    intrinsic value (dcf-modeling), long/short pitches with catalysts (long-short-ideas),
    or a broker-coverage memo (sell-side-view).
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
