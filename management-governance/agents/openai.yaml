interface:
  display_name: management governance
  short_description: 'Analyzes management quality and corporate governance for public
    companies globally — track record, incentive alignment, board effectiveness, capital
    allocation, shareholder structure, disclosure quality, leadership style & culture.
    Single-company deep dive OR 2–5 peer comparison. Calibrated by archetype (founder/CEO-led,
    family-controlled, dual-class, state-owned / SOE / VIE, two-tier, Japanese kansayaku,
    sponsor-backed, widely-held). Trigger: management quality, corporate governance,
    executive compensation, board independence, insider transactions, succession risk,
    capital allocation track record, company culture, controlling shareholder, dual-class
    structure, activist presence, governance red flags, "is [CEO] a good operator",
    "compare governance of [Co A] vs [Co B]". Do NOT use for a first-pass company
    screen (initial-screen).'
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
