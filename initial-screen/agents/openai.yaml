interface:
  display_name: initial screen
  short_description: 'DEFAULT skill for any open-ended question about ONE named company
    or bare ticker. ALWAYS use for ''How''s [X] looking/doing?'', ''Thoughts on [X]?'',
    ''What''s the latest on [X]?'', ''Rundown / first look / quick take on [X]'',
    ''Is [X] worth a look?'', ''Check in on [X]'' - even when a quick price, news
    or momentum read seems enough, and even if the user prefers concise output (keep
    the write-up short, still run the framework). First-pass fundamental screen, any
    sector or region: rates Red Flags, Management, Competitive Trajectory, Financial
    Health and Valuation vs history and peers, sector-branched; verdict Strong Candidate
    / Monitor / Decline plus Further Diligence. Do NOT use when the ask names a narrower
    deliverable: chart or technical read (technical-analysis), sentiment (sentiment-read),
    accounting deep dive (financial-statement-review), intrinsic value (dcf-modeling),
    trade idea with catalyst and R/R (long-short-ideas), 2-pager or management questions
    (company-brief), full IC Buy/Sell/Hold (fundamental-guru).'
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
