interface:
  display_name: fundamental guru
  short_description: Full single-company investment committee process — first-pass
    screen, sector-routed deep-dive modules (brand, channel, growth, cost, supply
    chain, technology, profit pool, capex cycle, cycle, utilization, ROE, moat), a
    two-round IC debate between Buffett-, Cathie Wood-, and Peter Lynch-style personas,
    a CIO Buy/Sell/Hold verdict with price ranges, and a five-question forward research
    plan. Uses Distilla MCP (ku_cell, company_drivers, standard_event, stock_price,
    financial_data_point, valuation_multiple, public library). Use this whenever the
    user asks for an investment committee review, IC memo, deep fundamental analysis,
    "run the full process" on a stock, a multi-perspective debate on a company, or
    a Buy/Sell/Hold verdict with a research plan, even if they just give a ticker
    and say "full workup". Do NOT use for a quick first look only (use initial-screen).
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
